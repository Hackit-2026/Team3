<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>文字モザイク処理アプリ</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 16px;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
  }
  #toolbar fieldset {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #canvasWrap {
    border: 1px solid #ccc;
    overflow: auto;
    max-width: 100%;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    cursor: crosshair;
  }
  #status {
    color: #666;
    margin: 8px 0;
    min-height: 1.2em;
  }
  button:disabled {
    opacity: 0.5;
  }
  #detectedTextsWrap {
    margin-top: 16px;
  }
  #detectedTextsWrap h2 {
    font-size: 1em;
    margin-bottom: 8px;
  }
  #detectedTextsList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #detectedTextsList li {
    display: flex;
    gap: 8px;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 6px 10px;
    font-family: monospace;
  }
  #detectedTextsList li.disabled {
    opacity: 0.45;
    text-decoration: line-through;
  }
  #detectedTextsList .text-id {
    color: #888;
    flex-shrink: 0;
  }
  #detectedTextsList .text-content {
    word-break: break-all;
    flex: 1;
  }
  #detectedTextsList .text-label {
    flex-shrink: 0;
    font-size: 0.8em;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
  }
  #detectedTextsList .text-label.private {
    background: #fdd;
    color: #a00;
  }
  #detectedTextsList .text-label.public {
    background: #dfd;
    color: #070;
  }
</style>
</head>
<body>

<h1>文字モザイク処理アプリ</h1>

<div id="toolbar">
  <input type="file" id="fileInput" accept="image/*">

  <fieldset>
    <legend>モザイク種類</legend>
    <label><input type="radio" name="mosaicType" value="black" checked> 黒塗り</label>
    <label><input type="radio" name="mosaicType" value="blur"> ぼかし</label>
    <label><input type="radio" name="mosaicType" value="pixelate"> ピクセル化</label>
  </fieldset>

  <button id="downloadBtn" disabled>ダウンロード</button>
</div>

<p id="status"></p>

<div id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>

<div id="detectedTextsWrap">
  <h2>検出された文字列</h2>
  <ul id="detectedTextsList"></ul>
</div>

<script>
const BACKEND_URL = "http://localhost:8000/api/detect-text";
const DRAG_THRESHOLD_PX = 4; // これ未満の移動はドラッグではなくクリックとして扱う

const fileInput = document.getElementById("fileInput");
const downloadBtn = document.getElementById("downloadBtn");
const statusEl = document.getElementById("status");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const detectedTextsList = document.getElementById("detectedTextsList");

const state = {
  image: null,
  boxes: [],       // { id, x, y, w, h, text } 画像の原寸座標
  mosaicType: "black",
  nextManualId: 1,
};

let dragStart = null;   // キャンバス座標系での mousedown 位置
let dragCurrent = null; // ドラッグ中の現在位置（プレビュー用）

function setStatus(text) {
  statusEl.textContent = text;
}

function applyMosaic(targetCtx, box) {
  const { x, y, w, h } = box;
  if (w <= 0 || h <= 0) return;

  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.rect(x, y, w, h);
  targetCtx.clip();

  if (state.mosaicType === "black") {
    targetCtx.fillStyle = "black";
    targetCtx.fillRect(x, y, w, h);
  } else if (state.mosaicType === "blur") {
    // 枠のサイズに比例した半径にすることで、文字の大きさに関わらず判読不能な強さにする
    const blurRadius = Math.max(12, Math.min(w, h) * 0.5);
    targetCtx.filter = `blur(${blurRadius}px)`;
    targetCtx.drawImage(state.image, 0, 0);
    targetCtx.filter = "none";
  } else if (state.mosaicType === "pixelate") {
    // 枠の短辺を目安にブロックサイズを決め、短辺あたり4ブロック程度の粗さにする
    const pixelSize = Math.max(14, Math.min(w, h) / 4);
    const smallW = Math.max(1, Math.round(w / pixelSize));
    const smallH = Math.max(1, Math.round(h / pixelSize));
    const off = document.createElement("canvas");
    off.width = smallW;
    off.height = smallH;
    const offCtx = off.getContext("2d");
    offCtx.drawImage(state.image, x, y, w, h, 0, 0, smallW, smallH);
    targetCtx.imageSmoothingEnabled = false;
    targetCtx.drawImage(off, 0, 0, smallW, smallH, x, y, w, h);
  }

  targetCtx.restore();
}

function redraw() {
  if (!state.image) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(state.image, 0, 0);

  for (const box of state.boxes) {
    if (box.enabled) applyMosaic(ctx, box);
  }

  if (dragStart && dragCurrent) {
    const x = Math.min(dragStart.x, dragCurrent.x);
    const y = Math.min(dragStart.y, dragCurrent.y);
    const w = Math.abs(dragCurrent.x - dragStart.x);
    const h = Math.abs(dragCurrent.y - dragStart.y);
    ctx.save();
    ctx.strokeStyle = "#00aaff";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }

  renderTextsList();
}

function renderTextsList() {
  detectedTextsList.innerHTML = "";
  for (const box of state.boxes) {
    const li = document.createElement("li");
    if (!box.enabled) li.classList.add("disabled");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = box.enabled;
    checkbox.title = "モザイクを適用する";
    checkbox.addEventListener("change", () => {
      box.enabled = checkbox.checked;
      redraw();
    });

    const idSpan = document.createElement("span");
    idSpan.className = "text-id";
    idSpan.textContent = box.id;

    const textSpan = document.createElement("span");
    textSpan.className = "text-content";
    textSpan.textContent = box.text ? box.text : "(手動追加)";

    li.appendChild(checkbox);
    li.appendChild(idSpan);
    li.appendChild(textSpan);

    if (box.label) {
      const labelSpan = document.createElement("span");
      labelSpan.className = `text-label ${box.label}`;
      labelSpan.textContent = box.label;
      li.appendChild(labelSpan);
    }

    detectedTextsList.appendChild(li);
  }
}

function canvasPointFromEvent(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY,
  };
}

function findBoxAt(point) {
  // 解除済み（enabled=false）の枠も再度クリックで復活できるよう、有効/無効を問わず対象にする。
  // 後から追加された（配列末尾の）枠を優先してヒット判定する
  for (let i = state.boxes.length - 1; i >= 0; i--) {
    const b = state.boxes[i];
    if (point.x >= b.x && point.x <= b.x + b.w && point.y >= b.y && point.y <= b.y + b.h) {
      return i;
    }
  }
  return -1;
}

canvas.addEventListener("mousedown", (evt) => {
  if (!state.image) return;
  dragStart = canvasPointFromEvent(evt);
  dragCurrent = dragStart;
});

canvas.addEventListener("mousemove", (evt) => {
  if (!dragStart) return;
  dragCurrent = canvasPointFromEvent(evt);
  redraw();
});

canvas.addEventListener("mouseup", (evt) => {
  if (!dragStart) return;
  const end = canvasPointFromEvent(evt);
  const moved = Math.hypot(end.x - dragStart.x, end.y - dragStart.y);

  if (moved < DRAG_THRESHOLD_PX) {
    // クリック扱い：該当する枠のモザイクを解除⇄再適用でトグルする
    const idx = findBoxAt(end);
    if (idx !== -1) {
      state.boxes[idx].enabled = !state.boxes[idx].enabled;
    }
  } else {
    // ドラッグ扱い：新しい枠を手動追加
    const box = {
      id: `manual_${state.nextManualId++}`,
      x: Math.min(dragStart.x, end.x),
      y: Math.min(dragStart.y, end.y),
      w: Math.abs(end.x - dragStart.x),
      h: Math.abs(end.y - dragStart.y),
      enabled: true,
      text: null,
    };
    state.boxes.push(box);
  }

  dragStart = null;
  dragCurrent = null;
  redraw();
});

canvas.addEventListener("mouseleave", () => {
  if (dragStart) {
    dragStart = null;
    dragCurrent = null;
    redraw();
  }
});

document.querySelectorAll('input[name="mosaicType"]').forEach((radio) => {
  radio.addEventListener("change", (evt) => {
    state.mosaicType = evt.target.value;
    redraw();
  });
});

fileInput.addEventListener("change", async (evt) => {
  const file = evt.target.files[0];
  if (!file) return;

  downloadBtn.disabled = true;
  state.boxes = [];

  const image = new Image();
  const objectUrl = URL.createObjectURL(file);

  await new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = reject;
    image.src = objectUrl;
  });

  state.image = image;
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  redraw();
  URL.revokeObjectURL(objectUrl);

  setStatus("文字を検出しています...");

  try {
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch(BACKEND_URL, { method: "POST", body: formData });
    if (!res.ok) {
      throw new Error(`サーバーエラー: ${res.status}`);
    }
    const data = await res.json();

    // public と判定された文字列は初期状態でモザイクを外しておく（private は従来通り既定でON）。
    state.boxes = data.texts.map((t) => ({
      id: t.id,
      x: t.x,
      y: t.y,
      w: t.w,
      h: t.h,
      enabled: t.label !== "public",
      text: t.text,
      label: t.label,
    }));
    redraw();
    setStatus(`${state.boxes.length} 件の文字候補を検出しました。`);
  } catch (err) {
    setStatus(`検出に失敗しました（バックエンドが起動しているか確認してください）: ${err.message}`);
  } finally {
    downloadBtn.disabled = false;
  }
});

downloadBtn.addEventListener("click", () => {
  if (!state.image) return;
  const link = document.createElement("a");
  link.download = "mosaic.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>

</body>
</html>
